<html lang="en-NZ">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#f8dce6">
    <meta name="apple-mobile-web-app-title" content="Rachelle Lillo">
    <meta name="application-name" content="Rachelle Lillo">

    <title>Rachelle Lillo</title>

    <meta
        name="description"
        content="Rachelle Lillo's personal website is currently in progress. Check back soon for more."
    >

    <meta name="robots" content="index, follow">

    <!-- Favicon -->

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

        "@type": "Person",

    <style>

        :root {

            --background: #fff5f8;

            --card: #ffffff;

            --card-dark: #fce8ef;

            --card-light: #fff1f5;

            --border: rgba(190, 105, 135, 0.14);

            --border-light: rgba(190, 105, 135, 0.22);

            --text: #38262d;

            --secondary: #876d76;

            --muted: #aa8f98;

        }


        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            min-height: 100vh;

            background: var(--background);

            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Helvetica Neue",
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;

            text-rendering: optimizeLegibility;

        }


        button,
        input,
        textarea,
        select {

            font-family: inherit;

        }


        a {

            color: inherit;

            text-decoration: none;

        }


        .container {

            width: min(92%, 620px);

            margin: 0 auto;

        }


        /* ========================================
           PROFILE
        ======================================== */

        header {

            text-align: center;

            padding: 55px 0 28px;

        }


        .headshot {

            width: 118px;

            height: 118px;

            display: block;

            margin: 0 auto 22px;

            border-radius: 50%;

            object-fit: cover;

            border: 1px solid rgba(190, 105, 135, 0.20);

            box-shadow:
                0 10px 40px rgba(190, 105, 135, 0.18);

        }


        h1 {

            font-size: clamp(32px, 8vw, 42px);

            line-height: 1.05;

            font-weight: 700;

            letter-spacing: -1.5px;

        }


        /* ========================================
           SOCIAL MEDIA
        ======================================== */

        .socials {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 25px;

            margin-top: 23px;

        }


        .social-link {

            width: 30px;

            height: 30px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #6f4d59;

            opacity: 0.88;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;

        }


        .social-link:hover {

            opacity: 1;

            transform: translateY(-2px);

        }


        .social-link svg {

            width: 25px;

            height: 25px;

            fill: currentColor;

        }


        /* ========================================
           MAIN CARD
        ======================================== */

        .property-card {

            margin-top: 22px;

            padding: 8px;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 22px;

            box-shadow:
                0 20px 60px rgba(190, 105, 135, 0.12);

        }


        /* ========================================
           WELCOME CONTENT
        ======================================== */

        .tab-content {

            display: block;

            padding: 0 14px 18px;

        }


        .section-title {

            margin-bottom: 8px;

            font-size: 20px;

            font-weight: 650;

            letter-spacing: -0.4px;

        }


        .empty-message {

            color: var(--secondary);

            font-size: 15px;

            line-height: 1.55;

        }


        /* ========================================
           ARROW OUTSIDE MAIN BOX
        ======================================== */

        .services-toggle-wrapper {

            display: flex;

            justify-content: center;

            padding: 18px 0 0;

        }


        .services-toggle {

            width: 48px;

            height: 48px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #ffffff;

            border: 1px solid rgba(190, 105, 135, 0.18);

            border-radius: 50%;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(190, 105, 135, 0.15);

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                transform 0.25s ease;

        }


        .services-toggle:hover {

            background: #fce8ef;

            border-color:
                rgba(190, 105, 135, 0.28);

        }


        .services-toggle:active {

            transform: scale(0.93);

        }


        .chevron {

            width: 15px;

            height: 15px;

            border-right: 2px solid #9d6f7e;

            border-bottom: 2px solid #9d6f7e;

            transform:
                rotate(45deg)
                translate(-2px, -2px);

            transition:
                transform 0.45s cubic-bezier(.4, 0, .2, 1);

        }


        .services-toggle.open .chevron {

            transform:
                rotate(225deg)
                translate(-2px, -2px);

        }


        /* ========================================
           EMPTY BOX REVEAL
        ======================================== */

        .services-reveal {

            display: grid;

            grid-template-rows: 0fr;

            opacity: 0;

            margin-top: 0;

            transition:
                grid-template-rows 0.55s cubic-bezier(.4, 0, .2, 1),
                opacity 0.35s ease,
                margin-top 0.55s cubic-bezier(.4, 0, .2, 1);

        }


        .services-reveal.open {

            grid-template-rows: 1fr;

            opacity: 1;

            margin-top: 42px;

        }


        .services-inner {

            min-height: 0;

            overflow: hidden;

        }


        /* ========================================
           EMPTY LOWER BOX
        ======================================== */

        .appraisal-card {

            min-height: 100px;

            background: #ffffff;

            border: 1px solid var(--border);

            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 18px 50px rgba(190, 105, 135, 0.10);

        }


        /* ========================================
           FOOTER
        ======================================== */

        footer {

            padding: 35px 0 45px;

            color: #aa8f98;

            font-size: 12px;

            text-align: center;

        }


        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 480px) {

            header {

                padding-top: 42px;

            }


            .headshot {

                width: 105px;

                height: 105px;

            }


            .property-card,
            .appraisal-card {

                border-radius: 19px;

            }

        }

    </style>

</head>


<body>


    <main class="container">


        <!-- ========================================
             PROFILE
        ======================================== -->

            <img
                class="headshot"
                src="profile.jpg"
                alt="Rachelle Lillo"
            >


            <h1>
                Rachelle Lillo
            </h1>


            <!-- SOCIAL MEDIA -->

            <div class="socials">


                <!-- INSTAGRAM -->

                <a
                    class="social-link"
                    href="https://instagram.com/RachLillo"
                    target="_blank"
                    rel="noopener noreferrer"

                    <svg

                    >

                        <rect
                            x="3"
                            y="3"

                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="4.2"
                            fill="none"

                        <circle

                </a>


                <!-- TIKTOK -->

                <a
                    class="social-link"
                    href="https://www.tiktok.com/@RachLillo"

                >

                    <svg
                        viewBox="0 0 24 24"

                    >

                        <path
                            d="M15.2 3c.3 2.5 1.7 4.2 4.2 4.4v3.1c-1.7-.1-3.1-.6-4.2-1.5v6.5c0 3.7-2.4 5.7-5.6 5.7-3 0-5.6-2.1-5.6-5.2 0-3.4 2.8-5.4 6.1-5.1v3.2c-1.7-.3-3 .5-3 1.9 0 1.2 1 2.1 2.3 2.1 1.5 0 2.6-.9 2.6-2.9V3h3.2z"
                        />

                    </svg>

                </a>


                <!-- YOUTUBE -->

                <a
                    class="social-link"
                    href="https://www.youtube.com/@RaeandCalix"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="YouTube"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M21.6 7.2a2.9 2.9 0 0 0-2-2C17.8 4.7 12 4.7 12 4.7s-5.8 0-7.6.5a2.9 2.9 0 0 0-2 2C2 9 2 12 2 12s0 3 .4 4.8a2.9 2.9 0 0 0 2 2c1.8.5 7.6.5 7.6.5s5.8 0 7.6-.5a2.9 2.9 0 0 0 2-2c.4-1.8.4-4.8.4-4.8s0-3-.4-4.8z"
                        />

                        <path
                            d="m10 15.5 5-3.5-5-3.5v7z"
                            fill="#ffffff"
                        />

                    </svg>

                </a>


            </div>

        </header>



        <!-- ========================================
             WELCOME BOX
        ======================================== -->

        <section class="property-card">


            <div
                id="welcome"
                class="tab-content"
            >

                <h2 class="section-title">
                    Hi, I'm Rachelle
                </h2>


                <p class="empty-message">
                    This website is currently in progress.
                </p>

            </div>


        </section>



        <!-- ========================================
             ARROW OUTSIDE MAIN BOX
        ======================================== -->

        <div class="services-toggle-wrapper">

            <button
                class="services-toggle"
                id="servicesToggle"
                type="button"
                aria-label="Show more"
                aria-expanded="false"
                aria-controls="propertyServices"
                onclick="toggleServices()"
            >

                <span class="chevron"></span>

            </button>

        </div>



        <!-- ========================================
             EMPTY LOWER BOX
        ======================================== -->

        <section
            class="services-reveal"
            id="propertyServices"
            aria-hidden="true"
        >

            <div class="services-inner">

                <div class="appraisal-card">
                </div>

            </div>

        </section>


    </main>



    <!-- ========================================
         FOOTER
    ======================================== -->

    <footer>

        © 2026 Rachelle Lillo

    </footer>



    <!-- ========================================
         JAVASCRIPT
    ======================================== -->

    <script>

        function toggleServices() {

            const services =
                document.getElementById('propertyServices');

            const toggle =
                document.getElementById('servicesToggle');


            const isOpen =
                services.classList.contains('open');


            if (isOpen) {

                services.classList.remove('open');

                toggle.classList.remove('open');

                toggle.setAttribute(
                    'aria-expanded',
                    'false'
                );

                toggle.setAttribute(
                    'aria-label',
                    'Show more'
                );

                services.setAttribute(
                    'aria-hidden',
                    'true'
                );

            } else {

                services.classList.add('open');

                toggle.classList.add('open');

                toggle.setAttribute(
                    'aria-expanded',
                    'true'
                );

                toggle.setAttribute(
                    'aria-label',
                    'Hide more'
                );

                services.setAttribute(
                    'aria-hidden',
                    'false'
                );

            }

        }

    </script>
